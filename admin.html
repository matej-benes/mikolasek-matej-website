<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><meta name="robots" content="noindex,nofollow"><title>Administrace akcí | Mikolášek Matěj</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#19191f;--text:#f6f4f1;--muted:#b7b2ad;--accent:#e7b86b;--line:#343139}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{width:min(900px,calc(100% - 32px));margin:45px auto}a{color:var(--accent)}h1{font-size:clamp(32px,6vw,52px);margin:8px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#111116;color:var(--text);font:inherit}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:10px 16px;border-radius:30px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}.primary{background:var(--accent);color:#17120b;border-color:var(--accent)}.danger{color:#ffaaa0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.muted{color:var(--muted)}.status{color:var(--accent);font-size:12px}.event{padding:16px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.hidden{display:none!important}#message{color:var(--accent);min-height:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}.event{display:block}}
</style></head><body><main><a href="/">← Zpět na oficiální web</a><p style="color:var(--accent);letter-spacing:.2em;font-size:12px;font-weight:bold;margin-top:28px">ADMINISTRACE</p><h1>Správa akcí</h1><p class="muted">Přístup pouze pro pověřený účet.</p>
<section id="login" class="panel"><h2>Přihlášení heslem</h2><form id="loginForm"><label>E-mail</label><input id="email" type="email" value="matej.romana@seznam.cz" autocomplete="username" required><label>Heslo</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="btn primary">Přihlásit se</button><button class="btn" id="forgot" type="button">Zapomenuté heslo</button></div></form><p class="muted">Přihlašuješ se svým e-mailem a heslem k účtu Supabase.</p></section><p id="message" role="status"></p><section id="recovery" class="panel hidden"><h2>Nastavit nové heslo</h2><form id="recoveryForm"><label>Nové heslo (alespoň 8 znaků)</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><label>Potvrdit nové heslo</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><div class="actions"><button class="btn primary">Uložit nové heslo</button></div></form></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="actions" style="justify-content:space-between"><h2 id="formTitle">Přidat akci</h2><button id="logout" class="btn">Odhlásit</button></div><form id="eventForm"><input id="eventId" type="hidden"><label>Název akce *</label><input id="title" required maxlength="160"><div class="grid"><div><label>Datum a čas *</label><input id="eventDate" type="datetime-local" required></div><div><label>Místo konání *</label><input id="venue" required maxlength="200"></div></div><label>Popis</label><textarea id="description"></textarea><label>Odkaz na plakát</label><input id="posterUrl" type="url" placeholder="https://…"><label>Odkaz na vstupenky</label><input id="ticketUrl" type="url" placeholder="https://…"><label>Stav</label><select id="status"><option value="draft">Koncept – nezveřejňovat</option><option value="published">Zveřejnit na webu</option></select><div class="actions"><button class="btn primary">Uložit akci</button><button id="reset" class="btn" type="button">Nová akce / vymazat</button></div></form></div><div class="panel"><h2>Uložené akce</h2><div id="events">Načítám…</div></div></section></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
const db=createClient("https://vdzadpsbkjetwgvadbgf.supabase.co","sb_publishable_437t9eM7Lg4HsNcZSdSOvw_AXoDvESD");
const el=id=>document.getElementById(id),login=el("login"),dash=el("dashboard");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=s=>el("message").textContent=s;
async function start(){const {data:{user}}=await db.auth.getUser();if(!user){login.classList.remove("hidden");dash.classList.add("hidden");return}const {data,error}=await db.rpc("is_artist_event_admin");if(error||data!==true){await db.auth.signOut();login.classList.remove("hidden");dash.classList.add("hidden");alert("Tento účet nemá oprávnění správce.");return}login.classList.add("hidden");dash.classList.remove("hidden");await load()}
el("loginForm").addEventListener("submit",async e=>{e.preventDefault();msg("Ověřuji přihlašovací údaje…");const {error}=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(error){msg("Přihlášení se nezdařilo. Zkontroluj e-mail a heslo.");return}msg("Přihlášení úspěšné.");await start()});\nel("forgot").addEventListener("click",async()=>{const email=el("email").value.trim();if(!email){msg("Nejdřív vyplň e-mail.");return}msg("Odesílám odkaz pro nastavení nového hesla…");const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/admin.html"});msg(error?"Odkaz se nepodařilo odeslat: "+error.message:"Odkaz pro nastavení nového hesla byl odeslán na e-mail.")});\nel("recoveryForm").addEventListener("submit",async e=>{e.preventDefault();if(el("newPassword").value!==el("confirmPassword").value){msg("Zadaná hesla se neshodují.");return}const {error}=await db.auth.updateUser({password:el("newPassword").value});if(error){msg("Heslo se nepodařilo změnit: "+error.message);return}el("recovery").classList.add("hidden");msg("Heslo bylo změněno. Nyní jsi přihlášen.");await start()});
el("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
function reset(){el("eventForm").reset();el("eventId").value="";el("formTitle").textContent="Přidat akci";msg("")}
el("reset").onclick=reset;
function edit(v){el("eventId").value=v.id;el("title").value=v.title;const d=new Date(v.event_date),p=n=>String(n).padStart(2,"0");el("eventDate").value=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());el("venue").value=v.venue;el("description").value=v.description||"";el("posterUrl").value=v.poster_url||"";el("ticketUrl").value=v.ticket_url||"";el("status").value=v.status;el("formTitle").textContent="Upravit akci";scrollTo({top:0,behavior:"smooth"})}
async function load(){const {data,error}=await db.from("artist_events").select("*").order("event_date");if(error){el("events").textContent="Chyba načítání: "+error.message;return}if(!data.length){el("events").innerHTML='<p class="muted">Zatím žádné akce.</p>';return}el("events").innerHTML=data.map(v=>'<article class="event"><div><strong>'+esc(v.title)+'</strong><div class="muted">'+esc(new Intl.DateTimeFormat("cs-CZ",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v.event_date)))+' · '+esc(v.venue)+'</div><div class="status">'+(v.status==="published"?"ZVEŘEJNĚNO":"KONCEPT")+'</div></div><div class="actions"><button class="btn" data-edit="'+v.id+'">Upravit</button><button class="btn danger" data-del="'+v.id+'">Smazat</button></div></article>').join("");el("events").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(data.find(v=>v.id===b.dataset.edit)));el("events").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const v=data.find(x=>x.id===b.dataset.del);if(!confirm("Smazat akci "+v.title+"?"))return;const {error}=await db.from("artist_events").delete().eq("id",v.id);msg(error?error.message:"Akce smazána.");await load()})}
el("eventForm").addEventListener("submit",async e=>{e.preventDefault();msg("Ukládám…");const id=el("eventId").value,payload={title:el("title").value.trim(),event_date:new Date(el("eventDate").value).toISOString(),venue:el("venue").value.trim(),description:el("description").value.trim()||null,poster_url:el("posterUrl").value.trim()||null,ticket_url:el("ticketUrl").value.trim()||null,status:el("status").value,updated_at:new Date().toISOString()};const result=id?await db.from("artist_events").update(payload).eq("id",id):await db.from("artist_events").insert(payload);if(result.error){msg("Uložení selhalo: "+result.error.message);return}msg("Uloženo.");reset();await load()});
db.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){el("login").classList.add("hidden");el("recovery").classList.remove("hidden")}else setTimeout(start,0)});await start();
</script></body></html>
